<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080b13"><title>Revista BACK · laboratório integrado</title>
<style>
:root{color-scheme:dark;--red:#ff365d;--paper:#0f121b;--paper2:#121622;--white:#f7f8fb;--ink:#eff0f3;--muted:#b5bac7}
*{box-sizing:border-box}html,body{height:100%;margin:0}body{background:radial-gradient(ellipse at 50% 42%,#1d2430 0%,#080b13 70%);font-family:Arial,Helvetica,sans-serif;color:var(--white);overflow:hidden}
.reader{width:100vw;height:100dvh;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;isolation:isolate}
.reader::before{content:"";position:absolute;inset:0;opacity:.2;background-image:radial-gradient(#92a2c4 0.55px,transparent 0.55px);background-size:7px 7px;pointer-events:none}
.book{width:min(94vw, calc(86dvh * 1.48));height:min(86dvh, calc(94vw / 1.48));aspect-ratio:1.48;position:relative;filter:drop-shadow(0 22px 36px #000a);perspective:2200px;touch-action:pan-y;user-select:none}
.book::before{content:"";position:absolute;z-index:35;pointer-events:none;left:calc(50% - 9px);width:18px;inset-block:0;background:linear-gradient(to right,transparent,#000a 43%,#ffffff0c 52%,transparent);opacity:.65}
.spread{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr}
.page{height:100%;min-width:0;overflow:hidden;position:relative;background:var(--paper);box-shadow:inset 0 0 25px #0004}
.page.left{border-radius:5px 0 0 5px}.page.right{border-radius:0 5px 5px 0}
.page:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0002,transparent 8%,transparent 88%,#0005)}
.page.left:after{background:linear-gradient(90deg,#0002,transparent 12%,transparent 84%,#0008)}
.sheet{position:absolute;left:50%;width:50%;top:0;height:100%;transform-style:preserve-3d;transform-origin:left center;z-index:23;display:none;pointer-events:none;will-change:transform}
.sheet .face{position:absolute;inset:0;backface-visibility:hidden;overflow:hidden;background:var(--paper)}
.sheet .face.back{transform:rotateY(180deg);box-shadow:inset 0 0 35px #0007}
.sheet .face.front:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0006,transparent 24%,transparent 78%,#000b)}
.sheet .face.back:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#0005,transparent 30%,#0004)}
.sheet .curl{position:absolute;right:0;bottom:0;pointer-events:none;width:var(--curl-size,0px);height:var(--curl-size,0px);z-index:8;background:linear-gradient(135deg,#ffffff08 0%,#ffffff88 30%,#ced4da 60%,#292b39 74%,#000a 90%);clip-path:polygon(100% 0,0 100%,100% 100%);filter:drop-shadow(-8px -7px 7px #000b);opacity:.93}
.page-inner{height:100%;width:100%;position:relative;overflow:hidden}
.topline{height:6.6%;position:relative;margin:0 6%;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #ffffff35;font-size:clamp(7px,.77vw,11px);letter-spacing:.1em;font-weight:800;z-index:2}
.topline .section{color:#c98865}.kicker{color:var(--red);font-size:clamp(8px,.85vw,12px);font-weight:900;letter-spacing:.18em;margin-bottom:2%}
.page-content{padding:5% 6% 6%}.page-content h1,.page-content h2,.page-content h3{margin:0;line-height:1.04;letter-spacing:-.045em}.page-content h1{font-size:clamp(24px,3.1vw,49px);font-weight:950}.page-content h2{font-size:clamp(20px,2.42vw,41px);font-weight:950}.page-content h3{font-size:clamp(13px,1.45vw,22px)}
.bodytext{font-size:clamp(11px,1.03vw,16px);line-height:1.54;color:#e1e2e9}.bodytext p{margin:0 0 .78em}.small{font-size:clamp(9px,.83vw,13px);line-height:1.46;color:var(--muted)}.page-no{position:absolute;bottom:2.7%;left:6%;font-size:clamp(9px,.8vw,12px);font-weight:900;letter-spacing:.13em;color:#c7cbd4}.page-no.r{left:auto;right:6%}
.brand{font-size:clamp(26px,4.35vw,70px);font-weight:950;line-height:.85;letter-spacing:-.075em;color:#fff;text-shadow:0 3px 18px #000a}.brand .dot{color:var(--red)}
.cover{background:#090c14}.cover:before{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;background:linear-gradient(180deg,#070a16bb 0%,transparent 24%,#0809141a 42%,#060911dd 73%,#050710 99%)}

@keyframes cinema{from{transform:scale(1.06)}to{transform:scale(1.2) translate(-1.2%,1.4%)}}
.cover-head{position:absolute;top:7%;left:6%;right:6%;z-index:3}.cover-k{color:#fff;font-size:clamp(8px,.88vw,14px);font-weight:900;letter-spacing:.12em;margin-bottom:2%}.cover-sub{font-size:clamp(8px,.85vw,13px);letter-spacing:.14em;font-weight:800;margin-top:2%}.cover-title{position:absolute;left:6%;right:6%;bottom:10%;z-index:4}.cover-title h1{font-size:clamp(30px,3.72vw,59px);line-height:.95;margin:.6% 0 2%;font-weight:950;letter-spacing:-.045em}.cover-title p{font-family:Georgia,serif;font-size:clamp(11px,1.08vw,17px);max-width:94%;line-height:1.35;margin:0}.cover-title .eyebrow{font-family:Arial;font-size:clamp(8px,.88vw,13px);color:#ff6278;font-weight:900;letter-spacing:.12em}
.cut{border-top:1px solid #f9526e;max-width:48%;margin:3% 0}.hardware-page{background:linear-gradient(155deg,#0f121c,#161b26 65%,#0b1118)}
.tech-head{padding:5% 6% 0}.tech-head h2{font-size:clamp(18px,2.25vw,37px);line-height:1.02;margin:3% 0 1.8%;font-weight:950;letter-spacing:-.045em}
.tech-head p{font-size:clamp(10px,.98vw,15px);line-height:1.4;color:#d7dce3;margin:0}
.tech-frame{position:relative;width:90%;margin:3% auto 0;aspect-ratio:900/590;background:#081820;border:1px solid #677e86;overflow:hidden;cursor:crosshair;touch-action:pan-y}
.tech-camera{position:absolute;inset:0;transform-origin:0 0;will-change:transform;transition:transform .58s cubic-bezier(.17,.74,.19,1)}
.tech-camera img{width:100%;height:100%;display:block;pointer-events:none}
.hotspot{position:absolute;z-index:10;border:1px solid transparent;background:transparent;border-radius:9px;cursor:zoom-in;padding:0;outline-offset:2px;touch-action:manipulation}
.hotspot:hover,.hotspot:focus-visible{border-color:#ff688d66;background:#ff31661a;box-shadow:0 0 0 1px #ff6b8773}
.hotspot:focus-visible{outline:2px solid #ff92a6}
.tech-frame.is-focused .hotspot{opacity:0}.tech-frame.is-focused .hotspot:hover{opacity:1}
.tech-label{position:absolute;z-index:12;left:2.5%;bottom:3%;right:2.5%;background:#07111be6;border-left:3px solid #ff486b;padding:2.5% 3%;opacity:0;transform:translateY(8px);transition:opacity .25s,transform .25s;pointer-events:none}
.tech-frame.is-focused .tech-label{opacity:1;transform:translateY(0)}.tech-label b{display:block;font-size:clamp(10px,.91vw,14px);color:#fff;margin-bottom:3px}.tech-label span{display:block;color:#d6e0e8;font-size:clamp(9px,.77vw,12px);line-height:1.35}
.zoom-tip{font-size:clamp(9px,.82vw,12px);color:#bfc9d7;padding:2.3% 5.5% 0;line-height:1.3}
.zoom-tip em{font-style:normal;color:#fe7992;font-weight:800}.tech-lower{display:grid;grid-template-columns:1fr 1fr;gap:4%;padding:2.5% 5.5%}.tech-lower .note{font-size:clamp(9px,.77vw,13px);line-height:1.36;color:#d9e0e9}.note strong{display:block;color:#fff;font-size:clamp(9px,.93vw,14px);margin-bottom:3px}
.editorial{background:#10131d}.editorial .hero-figure{height:37%;overflow:hidden;margin:5% 0 4%;position:relative;background:#101e2c}.editorial .hero-figure img{width:100%;height:100%;object-fit:cover;display:block;animation:cinema 22s ease-in-out infinite alternate}.editorial .hero-figure:after{content:"";inset:0;position:absolute;background:linear-gradient(transparent 55%,#080b14a0)}.editorial .hero-figure figcaption{position:absolute;left:4%;right:4%;bottom:5%;z-index:1;font-size:clamp(8px,.72vw,11px);color:#fff}
.infopage{background:#171d2b}.infopage .big-num{font-size:clamp(42px,6vw,96px);font-weight:900;color:#f44c6d;line-height:.94}.infopage .rule{height:3px;background:#ed456c;width:35%;margin:5% 0}.infopage .feature{margin:5% 0}.infopage .feature b{display:block;font-size:clamp(12px,1.25vw,20px);margin-bottom:2%;color:#fff}
.profile-note{display:flex;align-items:center;gap:3%;border-top:1px solid #fff4;padding:3.5% 0;font-size:clamp(9px,.9vw,14px);color:#dbe1e8}
.profile-mark{height:35px;width:35px;flex:0 0 35px;border-radius:50%;background:linear-gradient(135deg,#b62e51,#192439);display:flex;align-items:center;justify-content:center;font-weight:900}
.backpage{background:linear-gradient(160deg,#21364b,#111827 65%)}.backpage .wordmark{font-size:clamp(38px,5.7vw,90px);font-weight:950;letter-spacing:-.07em;line-height:.9}
.corner{position:absolute;z-index:18;bottom:0;right:0;width:clamp(48px,7vw,105px);height:clamp(48px,7vw,105px);background:transparent;border:0;cursor:grab;touch-action:none;display:flex;justify-content:flex-end;align-items:end;padding:9px;color:#ffd7e1;font-size:clamp(8px,.68vw,11px);font-weight:800}
.corner:before{content:"";position:absolute;right:0;bottom:0;width:76%;height:76%;clip-path:polygon(100% 0,0 100%,100% 100%);background:linear-gradient(130deg,#dfe3e9bb,#f8f8fa 35%,#3b4457 65%,#111420);filter:drop-shadow(-7px -7px 7px #0008);transition:width .25s,height .25s}
.corner:hover:before,.corner:focus-visible:before{width:100%;height:100%}.corner-label{position:absolute;bottom:6%;right:5%;transform:translate(-16px,-14px);pointer-events:none;color:#f0c4d4;text-shadow:0 1px 6px #000}
.corner.leftcorner{right:auto;left:0;transform:scaleX(-1)}.corner.leftcorner .corner-label{display:none}
.hint{position:absolute;bottom:1.9dvh;text-align:center;font-size:clamp(10px,.85vw,13px);font-weight:700;letter-spacing:.055em;color:#b8c3d5c7;pointer-events:none;left:8%;right:8%}
.pagenav{position:absolute;bottom:2%;right:6%;font-size:clamp(9px,.86vw,13px);color:#d2d8e5;letter-spacing:.14em;z-index:8}
.mobile-only{display:none}
@media(max-width:700px){.reader{align-items:center}.book{width:min(96vw,calc(85dvh*.75));height:min(85dvh,calc(96vw/.75));aspect-ratio:.75}.spread{grid-template-columns:1fr}.page.left{display:none}.page.right{border-radius:5px}.book:before{display:none}.sheet{left:0;width:100%}.topline{font-size:clamp(8px,2vw,11px)}.page-content h1{font-size:clamp(27px,6.3vw,46px)}.page-content h2{font-size:clamp(24px,5.9vw,39px)}.page-content h3{font-size:clamp(18px,3.7vw,23px)}.kicker{font-size:clamp(9px,2.35vw,13px)}.bodytext{font-size:clamp(12px,2.7vw,16px)}.small{font-size:clamp(10px,2.3vw,14px)}.brand{font-size:clamp(43px,11vw,70px)}.cover-title h1{font-size:clamp(33px,8.6vw,56px)}.cover-title p{font-size:clamp(13px,3.2vw,19px)}.cover-k,.cover-sub{font-size:clamp(9px,2.3vw,13px)}.tech-head h2{font-size:clamp(25px,5.9vw,38px)}.tech-head p{font-size:clamp(11px,2.6vw,15px)}.tech-frame{width:91%;margin-top:8%}.zoom-tip{font-size:clamp(10px,2.4vw,13px)}.tech-lower .note{font-size:clamp(10px,2.4vw,15px)}.tech-lower .note strong{font-size:clamp(12px,2.7vw,16px)}.tech-label b{font-size:clamp(11px,2.5vw,15px)}.tech-label span{font-size:clamp(10px,2.2vw,13px)}.page-no{font-size:11px}.hint{bottom:1.2dvh;font-size:11px}.mobile-only{display:block}.pagenav{font-size:11px}.profile-note{font-size:clamp(10px,2.6vw,15px)}}
@media(prefers-reduced-motion:reduce){.cover-art,.editorial .hero-figure img{animation:none}.tech-camera,.corner:before{transition:none}}

<template id="pg3"><div class="page-inner infopage"><div class="topline"><span>REVISTA BACK</span><span class="section">DESIGN EDITORIAL</span></div><div class="page-content"><div class="kicker">UM RECURSO A SERVIÇO DA MATÉRIA</div><h2>O papel encontra<br>o digital.</h2><div class="big-num">03</div><div class="rule"></div><div class="feature"><b>01. Folhear sem barra de ferramentas</b><div class="bodytext">A ponta da folha recebe o gesto. A virada revela o verso antes da próxima página.</div></div><div class="feature"><b>02. Inspecionar sem menus laterais</b><div class="bodytext">O foco nasce sobre o componente mostrado na própria fotografia.</div></div><div class="feature"><b>03. Movimento com propósito</b><div class="bodytext">Aproximações cinematográficas permanecem discretas e controláveis.</div></div></div><div class="page-no r">04 / 06</div></div></template>

iva de placa gráfica com seus componentes"><figcaption>Imagem demonstrativa de hardware, não teste de bancada.</figcaption></figure><div class="bodytext"><p>O zoom técnico é uma ferramenta de explicação. Ele aproxima conectores, dissipadores, trilhas e componentes, mas não cria detalhes ausentes da imagem original.</p><p>Para uma matéria verdadeira, a redação precisará atribuir informações ao manual e à documentação da fabricante.</p></div></div><div class="page-no">05 / 06</div></div></template>
<template id="pg5"><div class="page-inner backpage"><div class="topline"><span>REVISTA BACK</span><span class="section">CONTRACAPA</span></div><div class="page-content" style="padding-top:17%"><div class="kicker">FIM DO LABORATÓRIO</div><div class="wordmark">BACK<span style="color:#ff4268">.</span></div><div style="font-weight:900;font-size:clamp(21px,2.8vw,45px);margin-top:9%">VOLTAMOS<br>À LEITURA.</div><div class="cut" style="margin-top:8%"></div><div class="bodytext"><p>Esta demonstração testa uma página inteira com dois recursos integrados: folhear pelo canto e ampliação contextual da imagem.</p><p>É uma prova de interação. Não representa a identidade visual final aprovada nem conteúdo publicado.</p></div><div class="profile-note" style="margin-top:10%"><span class="profile-mark">B</span><span>REVISTA BACK · PROTÓTIPO PRIVADO</span></div></div><div class="page-no r">06 / 06</div></div></template>
<script>
(()=>{
'use strict';
const $=sel=>document.querySelector(sel);const book=$('#book'), left=$('#pageLeft'), right=$('#pageRight'),sheet=$('#sheet');let pageIndex=0,turning=false,pointer=null,pointerMoved=false,mobile=false;
const N=6,templates=Array.from({length:N},(_,i)=>$('#pg'+i).innerHTML);
const data={cpu:{x:.435,y:.355,z:2.6,title:'CPU / SOQUETE',desc:'Centralização no processador e nas conexões próximas ao soquete.'},vrm:{x:.245,y:.43,z:2.8,title:'VRM / ALIMENTAÇÃO',desc:'Área de reguladores de tensão, em detalhe. Uma matéria real precisaria conferir o projeto elétrico.'},ram:{x:.64,y:.43,z:2.75,title:'SLOTS DE MEMÓRIA RAM',desc:'Ampliação dos conectores de memória e sua disposição na placa.'},m2:{x:.515,y:.705,z:3.4,title:'SSD M.2 / NVMe',desc:'Zoom localizado no conector de SSD M.2, sem afastar o leitor da página.'},pcie:{x:.47,y:.84,z:3,title:'EXPANSÃO / PCIe',desc:'Região dos conectores de expansão. O número de linhas depende do modelo real.'}};
function isMobile(){return matchMedia('(max-width:700px)').matches}
function htmlAt(idx){return templates[((idx%N)+N)%N]}
function resetTech(node){node.querySelectorAll('[data-tech]').forEach(t=>{t.classList.remove('is-focused');t.dataset.locked='';t.querySelector('[data-camera]').style.transform='';const label=t.querySelector('[data-tech-label]');label.querySelector('b').textContent='';label.querySelector('span').textContent=''})}
function render(){mobile=isMobile();if(mobile){left.innerHTML='';right.innerHTML=htmlAt(pageIndex)}else{left.innerHTML=htmlAt(pageIndex);right.innerHTML=htmlAt(pageIndex+1)};resetTech(right);resetTech(left);$('#prevCorner').style.visibility=pageIndex===0?'hidden':'visible';$('#nextCorner').style.visibility=(mobile?pageIndex>=N-1:pageIndex>=N-2)?'hidden':'visible';$('#hint').textContent=mobile?'Puxe a ponta inferior direita para folhear · Toque no componente para ampliar':'Puxe o canto inferior direito para folhear · Passe o mouse nos componentes para ampliar';}
function techFocused(t,id,lock=false){const info=data[id];if(!t||!info)return;const c=t.querySelector('[data-camera]'),label=t.querySelector('[data-tech-label]');const w=t.clientWidth,h=t.clientHeight,tx=w*.5-info.x*w*info.z,ty=h*.5-info.y*h*info.z;c.style.transform=`translate3d(${tx}px,${ty}px,0) scale(${info.z})`;label.querySelector('b').textContent=info.title;label.querySelector('span').textContent=info.desc;t.classList.add('is-focused');t.dataset.part=id;if(lock)t.dataset.locked='1'}
function clearTech(t){if(!t)return;t.dataset.locked='';t.classList.remove('is-focused');t.querySelector('[data-camera]').style.transform='';t.dataset.part=''}
const behavior=matchMedia('(hover:hover) and (pointer:fine)');
book.addEventListener('pointerover',e=>{const el=e.target.closest('.hotspot');if(!el||!behavior.matches||turning)return;const t=el.closest('[data-tech]');if(t.dataset.locked)return;techFocused(t,el.dataset.part,false)});
book.addEventListener('pointerout',e=>{const el=e.target.closest('.hotspot');if(!el||!behavior.matches)return;const t=el.closest('[data-tech]');if(t.dataset.locked)return;clearTech(t)});
book.addEventListener('focusin',e=>{const el=e.target.closest('.hotspot');if(el)techFocused(el.closest('[data-tech]'),el.dataset.part,false)});
book.addEventListener('focusout',e=>{const el=e.target.closest('.hotspot');if(el){const t=el.closest('[data-tech]');if(!t.dataset.locked)clearTech(t)}});
book.addEventListener('click',e=>{const el=e.target.closest('.hotspot');if(el){const t=el.closest('[data-tech]');if(t.dataset.locked&&t.dataset.part===el.dataset.part)clearTech(t);else techFocused(t,el.dataset.part,true);return}const t=e.target.closest('[data-tech]');if(t&&t.dataset.locked){clearTech(t)}});
function step(){return mobile?1:2}
function setTurn(progress,dir){const p=Math.max(0,Math.min(1,progress));sheet.style.display='block';sheet.style.transition='none';sheet.style.transform=`rotateY(${(dir>0?-179:179)*p}deg)`;sheet.style.setProperty('--curl-size',Math.round(Math.min(220,book.clientWidth*.26)*(1-p)*Math.sin(Math.PI*p)+Math.max(0,10*(1-p)))+'px');sheet.style.filter=`drop-shadow(${dir>0?-1:1}0px 7px 9px #0008)`}
function prepare(dir){const move=step();const target=pageIndex+dir*move;if(target<0||target>N-move)return false;turning=true;resetTech(right);resetTech(left);const front=$('#flipFront'),back=$('#flipBack');
if(dir>0){front.innerHTML=mobile?htmlAt(pageIndex):htmlAt(pageIndex+1);back.innerHTML=mobile?htmlAt(target):htmlAt(target);if(mobile)right.innerHTML=htmlAt(target);else right.innerHTML=htmlAt(target+1)}else{front.innerHTML=mobile?htmlAt(pageIndex):htmlAt(pageIndex);back.innerHTML=mobile?htmlAt(target):htmlAt(target+1);if(mobile)right.innerHTML=htmlAt(target);else left.innerHTML=htmlAt(target)}
return true}
function animate(from,to,dir,commit){const duration=matchMedia('(prefers-reduced-motion:reduce)').matches?120:670;const start=performance.now();function frame(now){let t=Math.min(1,(now-start)/duration),ease=1-Math.pow(1-t,3);setTurn(from+(to-from)*ease,dir);if(t<1)requestAnimationFrame(frame);else{sheet.style.display='none';turning=false;if(commit)pageIndex+=dir*step();render()}}requestAnimationFrame(frame)}
function flip(dir){if(turning||!prepare(dir))return;setTurn(0,dir);animate(0,1,dir,true)}
const next=$('#nextCorner'),prev=$('#prevCorner');
function down(e,dir){if(turning||!prepare(dir))return;pointer={id:e.pointerId,x:e.clientX,y:e.clientY,dir,p:0,ts:performance.now()};pointerMoved=false;e.currentTarget.setPointerCapture(e.pointerId);e.preventDefault()}
function drag(e){if(!pointer||e.pointerId!==pointer.id)return;const dir=pointer.dir,dx=dir>0?pointer.x-e.clientX:e.clientX-pointer.x,dy=pointer.y-e.clientY;const width=(mobile?book.clientWidth:book.clientWidth/2);const p=Math.max(0,Math.min(1,(dx*.78+Math.max(0,dy)*.22)/(width*.92)));pointer.p=p;if(Math.abs(e.clientX-pointer.x)>9||Math.abs(e.clientY-pointer.y)>9)pointerMoved=true;setTurn(p,dir)}
function up(e){if(!pointer||e.pointerId!==pointer.id)return;const {p,dir}=pointer;pointer=null;const commit=!pointerMoved||p>.28;animate(p,commit?1:0,dir,commit);e.preventDefault()}
for(const [el,dir] of [[next,1],[prev,-1]]){el.addEventListener('pointerdown',e=>down(e,dir));el.addEventListener('pointermove',drag);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){e.preventDefault();flip(1)}if(e.key==='ArrowLeft'){e.preventDefault();flip(-1)}if(e.key==='Escape'){book.querySelectorAll('[data-tech]').forEach(clearTech)}});
let lastMobile=isMobile();window.addEventListener('resize',()=>{if(isMobile()!==lastMobile){lastMobile=isMobile();pageIndex=mobile?Math.min(pageIndex,N-1):Math.min(pageIndex%2===0?pageIndex:pageIndex-1,N-2);if(!turning)render()}else book.querySelectorAll('[data-tech]').forEach(t=>{if(t.dataset.part)techFocused(t,t.dataset.part,!!t.dataset.locked)})});
render();
window.__BACK_LAB__={getPage:()=>pageIndex,flip,focus:(part)=>{const t=right.querySelector('[data-tech]');if(t)techFocused(t,part,true)},reset:()=>{pageIndex=0;render()}};
})();
